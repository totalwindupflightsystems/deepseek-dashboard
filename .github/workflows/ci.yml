name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run tests
        run: npm test

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate index.html

  deploy-check:
    runs-on: ubuntu-latest
    needs: [test, html-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Verify index.html is deployable
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          echo "index.html exists ($(wc -l < index.html) lines, $(wc -c < index.html) bytes)"

      - name: Verify CDN SRI hashes (all 8 assets)
        run: |
          set -euo pipefail
          fail=0
          # DSD-GAP-055: ALL 8 CDN assets — 3 libs x 2 hosts (primary + fallback
          # mirror) plus the 2 sql.js wasm mirrors. Both hosts serve
          # byte-identical files for the pinned versions, so each URL must match
          # the app's single sha384 pin (same pins as the index.html loader and
          # SQL_WASM_SHA384_B64 in js/dashboard.js). Fails on mismatch or dead
          # URL. Format: <sha384-base64> <url>
          while read -r expected url; do
            [ -z "$expected" ] && continue
            echo "Checking: $url"
            body=$(mktemp)
            if ! curl -fsSL -o "$body" "$url"; then
              echo "  FAIL: could not fetch $url (HTTP error or network failure)"
              fail=1
              rm -f "$body"
              continue
            fi
            actual=$(openssl dgst -sha384 -binary "$body" | base64 -w0)
            rm -f "$body"
            if [ "$actual" = "$expected" ]; then
              echo "  PASS: sha384 matches (${actual:0:24}...)"
            else
              echo "  FAIL: sha384 mismatch"
              echo "    expected: $expected"
              echo "    actual:   $actual"
              fail=1
            fi
          done <<'EOF'
          +mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
          +mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js
          jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js
          jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js
          7Zym2PlgXfg8ap8cqJUwlZrLl+VEwt0NVbzYfhH28IWLnSpAgQOnSCY2+EXo5MtM https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/sql-wasm.js
          7Zym2PlgXfg8ap8cqJUwlZrLl+VEwt0NVbzYfhH28IWLnSpAgQOnSCY2+EXo5MtM https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-wasm.js
          x0YkuPkDHnKTZcB1JO4eb6j5+eU36aka+jBA6tOKTFaTz98b9V7fPT0QgZ9qyQW2 https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/sql-wasm.wasm
          x0YkuPkDHnKTZcB1JO4eb6j5+eU36aka+jBA6tOKTFaTz98b9V7fPT0QgZ9qyQW2 https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-wasm.wasm
          EOF
          if [ "$fail" -ne 0 ]; then
            echo "::error::SRI verification failed — CDN asset hash mismatch or dead URL detected"
            exit 1
          fi
          echo "SRI verification PASSED — all 8 CDN assets verified (3 libs x 2 hosts + 2 wasm mirrors)"
